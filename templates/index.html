<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ТАБЛИЦА ТВОИХ ЗАДАЧ</title>
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>

    <div class="container">
        <h2>ТАБЛИЦА ТВОИХ ЗАДАЧ</h2>
        <table id="myTable">
            <thead>
                <tr>
                    <th>Название</th>
                    <th>Количество</th>
                    <th>Время</th>
                </tr>
            </thead>
            <tbody>
            {% for task in tasks %}
            <tr>
                 <td>{{ loop.index }}</td>
                 <td contenteditable="true">{{ task[0] }}</td>
                 <td contenteditable="true">{{ task[1] }}</td>
                 <td contenteditable="true">{{ task[2] }}</td>
            </tr>
            {% endfor %}
            </tbody>
        </table>

        <button class="add-btn" onclick="addRow()">Добавить строку</button>
    </div>

    <script>
        function addRow() {
            let table = document.getElementById("myTable").getElementsByTagName('tbody')[0];
            let rowCount = table.rows.length + 1;
            let row = table.insertRow();
            row.innerHTML = `<td>${rowCount}</td>
                             <td contenteditable="true">...</td>
                             <td contenteditable="true">...</td>
                             <td contenteditable="true">...</td>`;
        }
    </script>
</body>
</html>
